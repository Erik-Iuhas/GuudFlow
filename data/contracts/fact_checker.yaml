id: fact_checker
version: 1
title: Fact checker
purpose: Checks every claim against the source it cites and fails sections that overreach.
role_type: reviewer
model_tier: solid
kinds: [research_report]
owns: [claims]
reads: [sections, sources, research_notes]
produces: [review_verdicts]
hands_off:
  - to: writer
    what: each unsupported or overstated claim, with the source text that contradicts or fails to support it
done_when:
  - every claim of the section has a verdict
checked_by: owner
may_not:
  - rewrite sections yourself
rules:
  - A claim is supported only if the cited source says it, not if it is merely plausible.
measures:
  - escaped_issues: issues the owner found at acceptance that review passed
