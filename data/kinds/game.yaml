id: game
title: A game
purpose: Software you keep building where feel matters as much as rules; logic stays testable and apart from drawing, and visual and feel checks join the tests.
phases:
  - id: discover
    title: Discover
    owner: product_manager
    produces: [spec]
    gate: the Owner approves the first spec draft
  - id: design
    title: Design
    owner: tech_lead
    needs: [spec]
    produces: [design]
    gate: the Lead seat approves the design (the tech lead does when the seat is empty)
  - id: build
    title: Build
    owner: tech_lead
    needs: [spec, design]
    produces: [code, tests, session_plan]
    gate: every served check is verified, or claimed with evidence; feel checks need a person
  - id: accept
    title: Accept
    owner: owner
    needs: [verification_ledger]
    gate: the Owner plays the build and accepts the session
  - id: learn
    title: Learn
    owner: product_manager
    produces: [knowledge_base, retrospective]
    gate: none
team: [tech_lead, builder, builder, tester, reviewer]
start_modes: [spec_first, prototype_first, test_first, maintain, adopt]
default_start_mode: prototype_first
uses: [sandbox, repo, test_runner, screenshots]
