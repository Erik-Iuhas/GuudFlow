# GuudFlow in Docker: the API, Studio and the in-process worker in one container that
# starts each agent's sandbox as a sibling container on the host's Docker daemon.
#
# Usage (Linux with Docker Engine; Docker Desktop cannot reach the per-run networks):
#   cp .env.example .env        # add ANTHROPIC_API_KEY (or save a key in Studio) and a token
#   docker compose up --build   # from the repo root
#   open http://localhost:8000  # paste GUUDFLOW_API_TOKEN at the top right
#
# Three things make sibling sandboxes work; do not change them without reading docs/SETUP.md:
#
# 1. network_mode: host. Each run creates a private Docker network and binds its LLM gateway
#    and MCP server to that network's gateway IP. That IP is an interface on the host, so
#    this container has to share the host's network to bind it. `ports:` does not apply in
#    host mode; GUUDFLOW_BIND decides which address the API listens on (localhost by default).
# 2. The data directory is mounted at the same absolute path inside and outside. Sandboxes
#    bind-mount run folders by path, and the host's Docker daemon resolves those paths on the
#    host. TMPDIR lives under it for the same reason (pre-review checks mount a temp folder).
# 3. NET_ADMIN, so each run can add iptables rules that let sandboxes reach only the gateway
#    and MCP ports on the host.
#
# Files the container writes under ./data are owned by root (sandboxes run as an unprivileged
# uid inside their own containers).

services:
  guudflow:
    build: .
    image: guudflow:latest
    container_name: guudflow
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      # Model key; leave unset to paste it in Studio (Settings → Models & providers).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Bearer token for the API and Studio. Set it.
      GUUDFLOW_API_TOKEN: ${GUUDFLOW_API_TOKEN:-}
      GUUDFLOW_MODE: ${GUUDFLOW_MODE:-dev}
      # production: never fall back to running agents on the host.
      GUUDFLOW_ENV: ${GUUDFLOW_ENV:-}
      # Same absolute path inside and outside (see 2. above).
      GUUDFLOW_DATA_DIR: ${GUUDFLOW_HOST_DATA:-${PWD}/data}
      TMPDIR: ${GUUDFLOW_HOST_DATA:-${PWD}/data}/tmp
      GUUDFLOW_STUDIO_DIST: /app/studio/dist
      GUUDFLOW_CORS_ORIGINS: ${GUUDFLOW_CORS_ORIGINS:-*}
      # 127.0.0.1 keeps the API on this machine; 0.0.0.0 exposes it on every interface.
      GUUDFLOW_BIND: ${GUUDFLOW_BIND:-127.0.0.1}
      GUUDFLOW_PORT: ${GUUDFLOW_PORT:-8000}
      # Optional: web search for the researcher role, and project-remote tokens.
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GUUDFLOW_GIT_TOKEN: ${GUUDFLOW_GIT_TOKEN:-}
    volumes:
      - ${GUUDFLOW_HOST_DATA:-${PWD}/data}:${GUUDFLOW_HOST_DATA:-${PWD}/data}
      # Sibling containers: talk to the host's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    # Seed the default personas and training scenarios (never overwriting), then serve.
    command:
      - sh
      - -c
      - >-
        mkdir -p "$$TMPDIR" &&
        python scripts/seed_data.py --data-root "$$GUUDFLOW_DATA_DIR" &&
        { [ -d "$$GUUDFLOW_DATA_DIR/training_camp" ] || cp -r /app/data/training_camp "$$GUUDFLOW_DATA_DIR"/; } &&
        exec uvicorn api.main:app --host "$$GUUDFLOW_BIND" --port "$$GUUDFLOW_PORT"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('GUUDFLOW_PORT','8000')+'/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
