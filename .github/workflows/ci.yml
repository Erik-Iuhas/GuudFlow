name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Cache is keyed on server.py, which holds the pinned OPENCODE_VERSION.
      - name: Cache opencode binary
        uses: actions/cache@v4
        with:
          path: .tools/opencode
          key: opencode-${{ runner.os }}-${{ hashFiles('core/harness/server.py', 'scripts/install_opencode.sh') }}

      - name: Install pinned opencode
        run: scripts/install_opencode.sh

      - name: Configure git identity
        run: |
          git config --global user.email "ci@guudflow.invalid"
          git config --global user.name "GuudFlow CI"

      # The Windows entry points must at least parse (PowerShell ships with the runner).
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: Run tests
        env:
          GUUDFLOW_SKIP_DOCKER_TESTS: "1"
        run: python -m pytest -q

  # Sandbox + escape suite (O10): real hardened containers, iptables host-port
  # rules (needs root), the opencode image built offline from .tools/opencode.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: sudo -H "$(which python)" -m pip install -r requirements.txt

      - name: Cache opencode binary
        uses: actions/cache@v4
        with:
          path: .tools/opencode
          key: opencode-${{ runner.os }}-${{ hashFiles('core/harness/server.py', 'scripts/install_opencode.sh') }}

      - name: Install pinned opencode
        run: scripts/install_opencode.sh

      - name: Configure git identity
        run: |
          sudo git config --global user.email "ci@guudflow.invalid"
          sudo git config --global user.name "GuudFlow CI"

      - name: Escape suite and sandbox tests (as root, for iptables)
        run: >
          sudo -E env "PATH=$PATH" "$(which python)" -m pytest -q -rs
          tests/worker/test_sandbox_manager.py
          tests/harness/test_run_docker.py
          tests/harness/test_escape_suite.py

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
